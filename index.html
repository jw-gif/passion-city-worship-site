<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Passion City Worship Team</title>
  <meta name="description" content="Everything you need to know about serving on the Passion City Church worship team — staff directory, scheduling, on-site logistics, and team guidelines.">

  <!-- Internal team handbook: reachable by link, kept out of search results. -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Passion City Worship Team">
  <meta property="og:description" content="Everything you need to know about serving on our worship team.">
  <meta name="theme-color" content="#0d0d0d">

  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="static/favicon.svg">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <!-- ===== SIDEBAR NAV ===== -->
  <nav class="sidebar" id="sidebar" aria-label="Handbook sections">
    <div class="sidebar-top">
      <div class="sidebar-logo">
        <span class="sidebar-logo__org">Passion City Church</span>
        <span class="sidebar-logo__team">Worship Team</span>
      </div>
    </div>

    <!-- Built from the database so renamed and added sections stay in sync. -->
    <ul class="sidebar-nav" id="sidebarNav"></ul>

    <div class="sidebar-footer">
      <a href="mailto:worship@passioncitychurch.com">worship@<br>passioncitychurch.com</a>
      <button type="button" class="sidebar-admin" id="adminToggle">Staff login</button>
    </div>
  </nav>

  <!-- Mobile top bar -->
  <div class="mobile-bar">
    <span class="mobile-bar__logo">Passion City Worship</span>
    <button class="mobile-bar__toggle" id="menuToggle" aria-label="Open menu"
            aria-controls="sidebar" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="page-wrap">

    <div class="stale-banner" role="status">
      Showing a saved offline copy &mdash; some details may be out of date.
    </div>

    <div id="sections">
      <p class="loading">Loading&hellip;</p>
    </div>

    <footer>
      <p>Passion City Church &mdash; <a href="mailto:worship@passioncitychurch.com">worship@passioncitychurch.com</a></p>
    </footer>

  </div><!-- /page-wrap -->

  <!-- Format toolbar (hidden until edit mode + selection) -->
  <div id="format-toolbar" class="format-toolbar" aria-hidden="true">
    <button type="button" data-cmd="bold"         title="Bold" aria-label="Bold"><b>B</b></button>
    <button type="button" data-cmd="italic"       title="Italic" aria-label="Italic"><i>I</i></button>
    <div class="toolbar-sep"></div>
    <button type="button" data-cmd="h2"           title="Heading" aria-label="Heading">H2</button>
    <button type="button" data-cmd="h3"           title="Sub-heading" aria-label="Sub-heading">H3</button>
    <button type="button" data-cmd="p"            title="Body text" aria-label="Body text">&para;</button>
    <div class="toolbar-sep"></div>
    <button type="button" data-cmd="ul"           title="Bullet list" aria-label="Bullet list">&#8226;</button>
    <button type="button" data-cmd="ol"           title="Numbered list" aria-label="Numbered list">1.</button>
    <div class="toolbar-sep"></div>
    <button type="button" data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting">T&#x0336;</button>
  </div>

  <!-- Floating edit / save / cancel button — revealed only for signed-in staff -->
  <div class="edit-fab" id="editFab" hidden>
    <div class="edit-fab__idle" id="fabIdle">
      <button type="button" class="edit-fab__btn" id="editBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Edit
      </button>
    </div>
    <div class="edit-fab__active" id="fabActive" hidden>
      <button type="button" class="edit-fab__cancel" id="cancelBtn">Cancel</button>
      <button type="button" class="edit-fab__save"   id="saveBtn">Save changes</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/site.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/auth-ui.js"></script>
</body>
</html>
