<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Passion City Worship Team</title>
  <meta name="description" content="Everything you need to know about serving on the Passion City Church worship team — staff directory, scheduling, on-site logistics, and team guidelines.">

  <!-- Internal team handbook: reachable by link, kept out of search results. -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Passion City Worship Team">
  <meta property="og:description" content="Everything you need to know about serving on our worship team.">
  <meta name="theme-color" content="#0d0d0d">

  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="static/favicon.svg">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

  <!-- ===== SIDEBAR NAV ===== -->
  <nav class="sidebar" id="sidebar" aria-label="Handbook sections">
    <div class="sidebar-top">
      <div class="sidebar-logo">
        <span class="sidebar-logo__org">Passion City Church</span>
        <span class="sidebar-logo__team">Worship Team</span>
        <!-- Only ever visible on the staging build (see js/env.js). -->
        <span class="env-badge" title="Preview build — content is shared with the live site">Staging</span>
      </div>
    </div>

    <!-- Built from the database so renamed and added sections stay in sync. -->
    <ul class="sidebar-nav" id="sidebarNav"></ul>

    <div class="sidebar-footer">
      <!-- Staff-only: the index of this page and every copy of it. -->
      <a class="env-link" id="pagesLink" href="/home" hidden>All pages →</a>
      <!-- Link to the other environment; js/env.js fills it in, or hides it.
           The address that used to sit here is in the page footer instead. -->
      <a class="env-link" id="envLink" hidden></a>
    </div>
  </nav>

  <!-- Mobile top bar -->
  <div class="mobile-bar">
    <span class="mobile-bar__logo">Passion City Worship</span>
    <span class="env-badge">Staging</span>
    <button class="mobile-bar__toggle" id="menuToggle" aria-label="Open menu"
            aria-controls="sidebar" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="page-wrap">

    <div class="stale-banner" role="status">
      Showing a saved offline copy &mdash; some details may be out of date.
    </div>

    <div id="sections">
      <p class="loading">Loading&hellip;</p>
    </div>

    <footer>
      <p>Passion City Church &mdash; <a href="mailto:worship@passioncitychurch.com">worship@passioncitychurch.com</a></p>
    </footer>

  </div><!-- /page-wrap -->

  <!-- Format toolbar (hidden until edit mode + selection) -->
  <div id="format-toolbar" class="format-toolbar" aria-hidden="true">
    <button type="button" data-cmd="bold"         title="Bold" aria-label="Bold"><b>B</b></button>
    <button type="button" data-cmd="italic"       title="Italic" aria-label="Italic"><i>I</i></button>
    <div class="toolbar-sep"></div>
    <button type="button" data-cmd="h2"           title="Heading" aria-label="Heading">H2</button>
    <button type="button" data-cmd="h3"           title="Sub-heading" aria-label="Sub-heading">H3</button>
    <button type="button" data-cmd="p"            title="Body text" aria-label="Body text">&para;</button>
    <div class="toolbar-sep"></div>
    <button type="button" data-cmd="ul"           title="Bullet list" aria-label="Bullet list">&#8226;</button>
    <button type="button" data-cmd="ol"           title="Numbered list" aria-label="Numbered list">1.</button>
    <div class="toolbar-sep"></div>
    <button type="button" data-cmd="link"   title="Add or edit a link" aria-label="Add or edit a link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    </button>
    <button type="button" data-cmd="btn"    title="Draw this link as a button" aria-label="Draw this link as a button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M7 12h10" stroke-linecap="round"/></svg>
    </button>
    <button type="button" data-cmd="unlink" title="Remove the link" aria-label="Remove the link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.8 12.2 21 10a5 5 0 0 0-7.07-7.07L11.8 5.06"/><path d="M5.2 11.8 3 14a5 5 0 0 0 7.07 7.07l2.12-2.12"/><path d="M2 2l20 20"/></svg>
    </button>
    <div class="toolbar-sep"></div>
    <button type="button" data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting">T&#x0336;</button>
  </div>

  <!-- Staff sign-in. The only route in; the edit controls below stay hidden
       until a signed-in editor is looking at live content. Kept outside the
       sidebar so it is still reachable once the sidebar goes off-canvas. -->
  <button type="button" class="staff-gear" id="adminToggle"
          aria-label="Staff sign-in" title="Staff sign-in">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>

  <!-- Floating edit / save / cancel button — revealed only for signed-in staff -->
  <div class="edit-fab" id="editFab" hidden>
    <div class="edit-fab__idle" id="fabIdle">
      <button type="button" class="edit-fab__btn" id="editBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        Edit
      </button>
    </div>
    <div class="edit-fab__active" id="fabActive" hidden>
      <button type="button" class="edit-fab__cancel" id="cancelBtn">Cancel</button>
      <button type="button" class="edit-fab__save"   id="saveBtn">Save changes</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/env.js"></script>
  <script src="js/site.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/auth-ui.js"></script>
</body>
</html>
